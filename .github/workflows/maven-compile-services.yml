name: Maven compile services

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [eureka-server, config-server, api-gateway, class-service, booking-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile ${{ matrix.service }}
        run: mvn -B -pl ${{ matrix.service }} -am compile
