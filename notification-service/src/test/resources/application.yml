spring:
  application:
    name: notification-service-test
  config:
    import: ""
  datasource:
    url: jdbc:h2:mem:notificationdb-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
